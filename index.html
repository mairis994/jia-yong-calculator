  <style>

und:none;color:#276a54;font:inherit;font-size:14px;font-weight:650;padding:8px 0;cursor:pointer}.text-button:hover{color:#174333}.calculate{border:0;border-radius:11px;background:#1c5445;color:#fff;padding:13px 24px;font:inherit;font-weight:700;cursor:pointer;transition:background .15s,transform .15s}.calculate:hover{background:#164535;transform:translateY(-1px)}.result{display:none;margin-top:18px;padding:24px}.result.show{display:block}.result-top{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:18px}.result h3{font-size:16px;margin:0}.total-label{font-size:12px;color:#758079;margin-bottom:5px}.total{color:#1c5445;font-weight:750;letter-spacing:-.04em;font-size:clamp(30px,6vw,40px)}.total small{font-size:14px;font-weight:600;letter-spacing:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th{text-align:left;color:#76827b;font-size:12px;font-weight:600;padding:10px 8px;border-bottom:1px solid #e7ebe5}td{padding:12px 8px;border-bottom:1px solid #eef0eb}td:last-child,th:last-child{text-align:right}.rate{color:#65736b}.money{font-variant-numeric:tabular-nums}.hint{margin:14px 0 0;color:#87918b;font-size:12px;line-height:1.6}.error{display:none;color:#a33c32;background:#fff3f1;border-radius:10px;padding:11px 13px;margin-top:12px;font-size:13px}.error.show{display:block}.foot{text-align:center;margin-top:22px;color:#8a948e;font-size:12px}
    @media(max-width:650px){.wrap{width:min(100% - 24px,1000px);padding:25px 0 42px}.top{margin-bottom:28px}.intro{margin-bottom:21px}.intro p{line-height:1.6}.form-card{padding:17px 14px}.line{grid-template-columns:1fr 40px;gap:10px;padding:12px}.field:first-child{grid-column:1}.field:nth-child(2){grid-column:1;grid-row:2}.field:nth-child(3){grid-column:2;grid-row:2}.field:nth-child(4){grid-column:1 / -1;grid-row:3}.remove{grid-column:2;grid-row:1;justify-self:end;width:40px}.actions{align-items:center}.calculate{padding:12px 18px}.result{padding:18px 14px}.result-top{align-items:center}.table-wrap{margin:0 -5px}th,td{padding-left:6px;padding-right:6px}}
    @media(max-width:380px){.wrap{width:calc(100% - 18px)}.line{padding:10px;gap:9px}.field select,.field input{font-size:13px;padding:0 9px}}
    .line{grid-template-columns:minmax(180px,1.4fr) minmax(125px,.9fr) minmax(130px,1fr) minmax(130px,1fr) 40px}.rules{margin-top:18px;overflow:hidden}.rules summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:20px 24px;font-weight:700}.rules summary::-webkit-details-marker{display:none}.rules summary:after{content:'＋';color:#276a54;font-size:20px}.rules[open] summary:after{content:'−'}.rules-body{padding:0 24px 24px}.rules-body>p{font-size:13px;line-height:1.6;color:#748078;margin:0 0 22px}.rule-group+.rule-group{margin-top:24px}.rule-heading{font-size:14px;margin:0 0 10px;color:#33443b}.fixed-rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fixed-rule{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid #e8ece6;border-radius:11px;background:#fcfdfa}.fixed-name{font-size:13px;color:#526159}.fixed-rate{font-size:13px;font-weight:700;color:#1c5445;white-space:nowrap}.rules-table{overflow:auto;border:1px solid #e7ebe5;border-radius:12px}.rules-table table{min-width:560px}.rules-table th{background:#f6f8f4}.rules-table th:first-child,.rules-table td:first-child{text-align:left}.rules-table td:not(:first-child),.rules-table th:not(:first-child){text-align:center}.tier-rate{font-weight:650;color:#53645a}@media(max-width:650px){.line{grid-template-columns:1fr 40px}.field:first-child{grid-column:1}.field:nth-child(2){grid-column:1;grid-row:2}.field:nth-child(3){grid-column:2;grid-row:2}.field:nth-child(4){grid-column:1 / -1;grid-row:3}.remove{grid-column:2;grid-row:1}.rules summary{padding:18px}.rules-body{padding:0 14px 18px}.fixed-rules{grid-template-columns:1fr}.rules-table table{min-width:480px}}
    :root{color:#202a26;background:#f4f2ec}body{background:radial-gradient(ellipse at 50% -18%,#e8e7dd 0,transparent 47%),#f4f2ec}.wrap{width:min(100% - 40px,900px);padding:48px 0 72px}.top{margin-bottom:56px}.mark{background:#173d32;border-radius:13px;color:#e5c98f;box-shadow:0 5px 16px #173d321c}.eyebrow{color:#8b7851;letter-spacing:.18em;font-size:10px}.top h1{font-size:18px;letter-spacing:.06em}.intro{margin-bottom:30px}.intro h2{font-size:clamp(32px,5.5vw,48px);font-weight:650;letter-spacing:-.045em;color:#1d2d26}.intro p{font-size:14px;color:#72766e;line-height:1.8}.card{border-color:#e8e5dc;border-radius:18px;box-shadow:0 14px 40px #303b2b0a}.form-card{padding:28px}.section-head{margin-bottom:20px}.section-head h3{font-size:15px;letter-spacing:.04em}.muted{font-size:12px;color:#8c8e85}.line-list{gap:12px}.line{background:#fdfdfb;border-color:#ece9e1;border-radius:13px;padding:15px}.field label{font-size:11px;letter-spacing:.015em;color:#73796f}.field select,.field input{height:46px;border-color:#e4e3dc;border-radius:9px;background:#fff;color:#28362f;font-size:13px}.field select:focus,.field input:focus{border-color:#a68c5b;box-shadow:0 0 0 3px #a68c5b1a}.remove{color:#a1a397}.remove:hover{background:#f4f1e8;color:#845f32}.text-button{color:#536a5a;font-size:13px}.calculate{background:#173d32;border-radius:9px;padding:13px 22px;font-size:13px;letter-spacing:.02em}.calculate:hover{background:#245344}.result{border-color:#e5e3d8}.total{color:#173d32}.total-label{color:#85877e;letter-spacing:.04em}.rules{margin-top:14px}.rules summary{padding:20px 24px;color:#28362f;font-size:14px}.rules summary:after{color:#a68c5b}.rules-body>p{color:#777a71}.rule-heading{font-size:12px;letter-spacing:.04em;color:#8a7650}.fixed-rule{background:#fff;border-color:#ebe8df;border-radius:9px;padding:13px 15px}.fixed-name{color:#505950}.fixed-rate{color:#173d32}.rules-table{border-color:#e9e6dc;border-radius:10px;background:#fff}.rules-table th{background:#f5f3ed;color:#77786f}.rules-table td{color:#4f5b52}.tier-rate{color:#173d32!important}.foot{color:#94948a;font-size:11px;letter-spacing:.02em}
    @media(max-width:650px){.wrap{width:calc(100% - 24px);padding:28px 0 48px}.top{margin-bottom:40px}.intro{margin-bottom:23px}.intro h2{font-size:34px}.form-card{padding:19px 14px}.line{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;padding:12px}.field:first-child{grid-column:1 / 3}.field:nth-child(2){grid-column:1;grid-row:2}.field:nth-child(3){grid-column:2;grid-row:2}.field:nth-child(4){grid-column:1 / -1;grid-row:3}.remove{grid-column:3;grid-row:1}.rules summary{padding:17px}.rules-body{padding:0 14px 18px}.result{padding:18px 14px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div class="mark">甲</div><div><div class="eyebrow">COMMISSION ESTIMATOR</div><h1>甲佣計算</h1></div></header>
    <section class="intro"><h2>快速試算你的佣金</h2><p>選擇商品與月保費或年保費收入；適用商品再填單件保額。</p></section>
    <section class="card form-card" aria-label="佣金試算輸入">
      <div class="section-head"><h3>保單資料</h3><span class="muted">可加入多筆商品</span></div>
      <div class="line-list" id="lineList"></div>
      <div id="error" class="error" role="alert"></div>
      <div class="actions"><button class="text-button" id="add">＋ 新增一筆</button><button class="calculate" id="calculate">計算佣金　→</button></div>
    </section>
    <section class="card result" id="result" aria-live="polite"></section>
    <details class="card rules"><summary>查詢計算規則</summary><div class="rules-body"><p>以下列出商品適用的佣金比例與保額級距。</p><section class="rule-group"><h4 class="rule-heading">固定佣金比例</h4><div class="fixed-rules" id="fixedRules"></div></section><section class="rule-group"><h4 class="rule-heading">依單件保額計算</h4><div class="rules-table"><table><thead><tr><th>商品</th><th>10 萬～29 萬</th><th>30 萬～49 萬</th><th>50 萬以上</th></tr></thead><tbody id="tierRules"></tbody></table></div></section></div></details>
    <p class="foot">試算結果僅供參考，實際金額依公司核定規則為準。</p>
  </main>
  <template id="rowTemplate"><div class="line">
    <div class="field"><label>商品</label><select class="product"></select></div>
    <div class="field"><label>保費輸入方式</label><select class="premium-mode"><option value="monthly">月保費收入</option><option value="annual">年保費收入</option></select></div>
    <div class="field premium-field"><label>月保費收入（元）</label><input class="premium" type="number" min="0" step="1" inputmode="decimal" placeholder="例如 3,000"></div>
    <div class="field face-field"><label>單件保額（元）</label><input class="face" type="number" min="0" step="10000" inputmode="numeric" placeholder="例如 300,000"></div>
    <button class="remove" type="button" aria-label="移除此筆">×</button>
  </div></template>
  <script>
    const fixed=[['日額型','H01',.05],['金平安','A02',.15],['吉安','A01',.02],['守護小額終身 6年期','W20',.042],['守護小額終身 10年期','W21',.088],['守護小額終身 15年期','W22',.128],['守護小額終身 20年期','W23',.168],['一年期定期壽險','T12',.05]];
    const tiered=[
      ['金郵利 6年期','W24',[.025,.028,.032]],['金郵利 10年期','W25',[.05,.058,.065]],['好吉利','E12',[.015,.018,.02]],
      ['珍愛015 6年期','E10',[.0168,.0188,.0228]],['珍愛015 10年期','E11',[.0428,.0458,.0498]],
      ['年年常春 6年期','I26',[.0208,.0218,.0238]],['年年常春 10年期','I27',[.049,.05,.052]],
      ['常鴻 6年期','I24',[.0128,.0138,.0168]],['常鴻 10年期','I25',[.0408,.0438,.0458]],
      ['金幸福','E08',[.01,.0138,.0188]],['常樂','I23',[.012,.018,.022]],['郵幸福','E07',[.02,.025,.035]]
    ];
    const products=[...fixed.map(([name,code,rate])=>({name,code,rate})),...tiered.map(([name,code,rates])=>({name,code,rates}))];
    const money=n=>new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2}).format(n);
    const list=document.querySelector('#lineList'), result=document.querySelector('#result'), error=document.querySelector('#error');
    function addRow(){const row=document.querySelector('#rowTemplate').content.firstElementChild.cloneNode(true),select=row.querySelector('.product'),mode=row.querySelector('.premium-mode'),label=row.querySelector('.premium-field label'),input=row.querySelector('.premium');products.forEach((p,i)=>{const option=document.createElement('option');option.value=i;option.textContent=`${p.name}（${p.code}）`;select.append(option)});const update=()=>{row.querySelector('.face-field').style.display=products[select.value].rates?'':'none';label.textContent=mode.value==='monthly'?'月保費收入（元）':'年保費收入（元）';input.placeholder=mode.value==='monthly'?'例如 3,000':'例如 36,000';result.classList.remove('show')};select.addEventListener('change',update);mode.addEventListener('change',update);row.querySelector('.remove').addEventListener('click',()=>{if(list.children.length>1)row.remove();else{input.value='';row.querySelector('.face').value=''}result.classList.remove('show')});row.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>result.classList.remove('show')));list.append(row);update()}
    function calc(){error.classList.remove('show');const rows=[...list.children],items=[];for(let i=0;i<rows.length;i++){const row=rows[i],p=products[row.querySelector('.product').value],amount=Number(row.querySelector('.premium').value),mode=row.querySelector('.premium-mode').value,face=Number(row.querySelector('.face').value);if(!Number.isFinite(amount)||amount<=0){error.textContent=`第 ${i+1} 筆請輸入大於 0 的${mode==='monthly'?'月':'年'}保費收入。`;error.classList.add('show');return}let rate=p.rate;if(p.rates){if(!face||face<100000){error.textContent=`第 ${i+1} 筆「${p.name}」單件保額需至少 10 萬元。`;error.classList.add('show');return}rate=p.rates[face<300000?0:face<500000?1:2]}const annual=mode==='monthly'?amount*12:amount;items.push({name:p.name,code:p.code,amount,mode,annual,rate,commission:annual*rate})}const total=items.reduce((s,x)=>s+x.commission,0);result.innerHTML=`<div class="result-top"><h3>佣金試算結果</h3><div style="text-align:right"><div class="total-label">佣金合計</div><div class="total">${money(total)} <small>元</small></div></div></div><div class="table-wrap"><table><thead><tr><th>商品</th><th>輸入保費</th><th>年繳應收保費</th><th>佣金率</th><th>佣金</th></tr></thead><tbody>${items.map(x=>`<tr><td>${x.name}（${x.code}）</td><td class="money">${money(x.amount)}（${x.mode==='monthly'?'月':'年'}）</td><td class="money">${money(x.annual)}</td><td class="rate">${(x.rate*100).toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}%</td><td class="money"><strong>${money(x.commission)}</strong></td></tr>`).join('')}</tbody></table></div><p class="hint">月保費收入 × 12 換算成年繳應收保費；年保費收入直接作為年繳應收保費。再乘以適用佣金率，未另行取整。</p>`;result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'nearest'})}
    const percent=r=>`${(r*100).toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}%`;
    document.querySelector('#fixedRules').innerHTML=fixed.map(([name,code,rate])=>`<div class="fixed-rule"><span class="fixed-name">${name}（${code}）</span><span class="fixed-rate">${percent(rate)}</span></div>`).join('');
    document.querySelector('#tierRules').innerHTML=tiered.map(([name,code,rates])=>`<tr><td>${name}（${code}）</td>${rates.map(r=>`<td class="tier-rate">${percent(r)}</td>`).join('')}</tr>`).join('');
    document.querySelector('#add').addEventListener('click',addRow);document.querySelector('#calculate').addEventListener('click',calc);addRow();
  </script>
</body>
</html>
